<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studen result form</title>
    <style>
        :root{
            --bg1:#FFDEE9;
            --bg2:#B5FFFC;
            --card:#ffffffc9;
            --accent:#6C63FF;
            --accent2:#FF6B6B;
            --success:#28a745;
            --danger:#dc3545;
            --muted:#6b7280;
        }
        *{box-sizing:border-box;
            font-family:Segoe UI, Roboto, Arial, sans-serif
        }
        body{
            margin:0;
            min-height:100vh;
            background:linear-gradient(135deg,var(--bg1),var(--bg2));
            display:flex;
            align-items:center;
            justify-content:center;
            padding:40px;
        }
        .card{
            background:var(--card);
            padding:28px;
            border-radius:14px;
            box-shadow:0 10px 30px rgba(0,0,0,0.12);
            width:380px;
            max-width:95%;
        }
        h1{margin:0 0 14px 0;
            font-size:20px;
            color:var(--accent);
            text-align:center
        }
        label{
            display:block;color:var(--muted);
            font-size:13px;
            margin-bottom:6px
        }
        input[type="text"],input[type="number"]{
            width:100%;
            padding:10px 12px;
            border-radius:8px;border:1px solid #e6e6e6;
            margin-bottom:12px;
            font-size:14px;
            
        }
        input[type="number"]::-webkit-inner-spin-button{appearance:auto}

        #checkBtn{
            width:100%;
            padding:10px;
            border-radius:10px;
            border:none;
            color:#fff;
            font-weight:600;
            background:linear-gradient(90deg,var(--accent),var(--accent2));
            cursor:pointer
        }
        #checkBtn:hover{
            opacity:0.95;
            background:linear-gradient(90deg,var(--accent2),var(--accent));
        }
        .result{
            margin-top:14px;
            padding:12px;
            border-radius:8px;
            font-weight:600;
            text-align:center;
            display:none}
        .result.pass{
            background:rgba(40,167,69,0.12);
            color:var(--success);
            border:1px solid rgba(40,167,69,0.18)
        }
        .result.fail{
            background:rgba(220,53,69,0.08);
            color:var(--danger);
            border:1px solid rgba(220,53,69,0.12)}
        .meta{
            font-size:12px;
            color:#374151;
            margin-top:8px;
            text-align:center
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Student Result Form</h1>
        <form id="resultForm" onsubmit="return false">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="roll">Roll Number:</label>
            <input type="text" id="roll" name="roll" required>

            <label for="math">Mathematics:</label>
            <input type="number" id="math" name="math" min="0" max="100" required>

            <label for="science">Science:</label>
            <input type="number" id="science" name="science" min="0" max="100" required>

            <label for="english">English:</label>
            <input type="number" id="english" name="english" min="0" max="100" required>

            <label for="history">Tamil:</label>
            <input type="number" id="history" name="history" min="0" max="100" required>

            <label for="computer">Social:</label>
            <input type="number" id="computer" name="computer" min="0" max="100" required>

            <button type="button" id="checkBtn" onclick="checkResult()">Check Result</button>
        </form>

        <div id="resultBox" class="result" role="status" aria-live="polite"></div>
        <div class="meta">Total: <span id="totalText">0</span> / 500 • Average: <span id="avgText">0.00</span></div>
    </div>

    <script>
        function checkResult() {
            const name = document.getElementById('name').value.trim() || '—';
            const roll = document.getElementById('roll').value.trim() || '—';
            const subjects = ['math', 'science', 'english', 'history', 'computer'];
            const marks = subjects.map(id => parseFloat(document.getElementById(id).value));

            for (let i = 0; i < marks.length; i++) {
                const m = marks[i];
                if (!Number.isFinite(m) || m < 0 || m > 100) {
                    alert('Please enter valid marks between 0 and 100 for all five subjects.');
                    return;
                }
            }

            const total = marks.reduce((a, b) => a + b, 0);
            const average = total / marks.length;

            const pass = marks.every(m => m >= 35) && average >= 35;
            const status = pass ? 'PASS' : 'FAIL';

    
            const resultBox = document.getElementById('resultBox');
            resultBox.textContent = `${status} — ${name} (Roll: ${roll})`;
            resultBox.classList.remove('pass', 'fail');
            resultBox.classList.add(pass ? 'pass' : 'fail');
            resultBox.style.display = 'block';

            document.getElementById('totalText').textContent = total;
            document.getElementById('avgText').textContent = average.toFixed(2);

           
            //alert(`Name: ${name}\nRoll: ${roll}\nTotal: ${total}/500\nAverage: ${average.toFixed(2)}\nResult: ${status}`);
        }
    </script>
    
</body>
</html>
