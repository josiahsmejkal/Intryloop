<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
  
</head>
<body>
    <form action="">
        <label for="name">First Name:</label>
        <input type="text" id="name" name="name"><br>

         <label for="last">Last Name:</label>
        <input type="text" id="last" name="name"><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br>

        <label for="pass">Password:</label>
        <input type="password" ><br><br>
        <label>Gender:</label>
        <input type="radio" id="g">
        <label for="g">Male</label>
        <input type="radio" id="g">
        <label for="g">Female</label><br>
         <input type="radio" id="g">
        <label for="g">Other</label><br>

        <label for="age">Age</label>
        <input type="number" id="age" name="age" min="1" max="100"><br><br>

        <label>Preferences:</label><br>
        <input type="checkbox">Acrylsc Painting<br>
        <input type="checkbox">Oil Painting<br>
        <input type="checkbox">Watercolor Painting<br>
        <br>

        <label for="">Select Occupation</label><br>
         <label>Country</label>
       <select>
         <option selected>Student</option>
            <option>Engineer</option>
         <option>Teacher</option>
       </select>
       <br>
        <label for="">Bio</label><br>
        <textarea name="" id="" rows="7" cols="25"></textarea><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
    
</body>
</html>
